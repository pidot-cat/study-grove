name: study_grove
description: A gamified study app for college students that combines plant growth mechanics with AI-powered document processing and quiz generation.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ── State Management ──
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # ── Firebase & Backend ──
  supabase_flutter: ^1.10.0
  
  # ── AI & LLM Integration ──
  google_generative_ai: ^0.3.0
  
  # ── File Handling ──
  file_picker: ^5.4.0
  pdf: ^3.10.0
  pdfx: ^2.6.0
  docx_to_text: ^0.8.1
  
  # ── UI & Animation ──
  lottie: ^2.6.0
  rive: ^0.11.0
  flutter_animate: ^4.2.0
  
  # ── Navigation & Routing ──
  go_router: ^12.0.0
  
  # ── Storage & Preferences ──
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # ── Database ──
  sqflite: ^2.3.0
  
  # ── Utilities ──
  intl: ^0.19.0
  uuid: ^4.0.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.0
  
  # ── UI Components ──
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  
  # ── Audio & Haptics ──
  audioplayers: ^5.2.0
  haptic_feedback: ^2.1.0
  
  # ── Logging & Debugging ──
  logger: ^2.0.0
  
  # ── Network & HTTP ──
  dio: ^5.3.0
  http: ^1.1.0
  
  # ── Localization ──
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
